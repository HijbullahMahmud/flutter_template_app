name: ag_pos
description: A production-ready Flutter clean architecture starter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  dio: ^5.11.0
  dio_cache_interceptor: ^4.0.7
  flutter_bloc: ^9.1.1
  freezed_annotation: ^3.1.0
  go_router: ^17.0.1
  intl: any
  json_annotation: ^4.9.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.10.4
  freezed: 3.2.5
  flutter_lints: ^6.0.0
  json_serializable: 6.11.3

flutter:
  generate: true
  uses-material-design: true
